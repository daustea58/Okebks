name: Build Kernel Surya

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup timezone
        uses: szenius/set-timezone@v2.0
        with:
          timezoneLinux: "Asia/Jakarta"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev libelf-dev \
            build-essential zip curl git python3 python3-pip

      - name: Notify build started
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message: |
            🛠️ Build kernel Surya dimulai...
            📦 Repo: ${{ github.repository }}
            🌿 Branch: ${{ github.ref_name }}

      - name: Run build script
        run: |
          chmod +x build.sh
          source build.sh
          echo "ZIPNAME=${ZIPNAME}" >> "$GITHUB_ENV"

      - name: Setup build date
        run: echo "BUILD_DATE=$(date '+%H:%M %d/%m/%Y')" >> "$GITHUB_ENV"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: kernel-surya
          path: ${{ env.ZIPNAME }}

      - name: Upload to Telegram
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          document: ${{ env.ZIPNAME }}
          message: |
            ✅ Kernel Surya (surya) – MIUI 12.0.9
            📅 ${{ env.BUILD_DATE }}
            🧠 MemKernel (LKM) + Gaming Mode (schedhorizon + zen-iosched)

      - name: Notify on failure
        if: failure()
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message: |
            ❌ Build kernel Surya gagal.
            📦 Repo: ${{ github.repository }}
            🔗 Cek log: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            
